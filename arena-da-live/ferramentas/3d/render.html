<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
@font-face{font-family:Teko;font-weight:700;src:url(/public/comum/fontes/teko-700.woff2)}
html,body{margin:0;background:#000}
</style></head><body>
<script type="module">
// Página de renderização usada por gerar-3d.mjs (não faz parte do jogo).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { criarLutador, POSES, aplicarPose } from './lutador3d.js';
import { criarArena, criarLuzes } from './arena3d.js';
import { PERSONAGENS, TEMAS, CAMERA, LUTADOR, CAIXAS } from './personagens3d.js';

await document.fonts.load('700 100px Teko');
const W = 1080, H = 1920;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap;
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = () => {
  const c = new THREE.PerspectiveCamera(CAMERA.fov, W / H, 0.1, 80);
  c.position.set(...CAMERA.pos);
  c.lookAt(...CAMERA.alvo);
  return c;
};
const cache = new Map();
const lutador = (id) => {
  if (!cache.has(id)) cache.set(id, criarLutador(PERSONAGENS[id]));
  return cache.get(id);
};
function posicionar(l, lado, pose) {
  aplicarPose(l, POSES[pose], lado === 0);
  const s = lado === 0 ? -1 : 1;
  l.position.set(s * LUTADOR.x, 0, LUTADOR.z);
  l.rotation.set(0, lado === 0 ? Math.PI / 2 - LUTADOR.giro : -Math.PI / 2 + LUTADOR.giro, 0);
}

window.renderizar = async (p) => {
  const tema = TEMAS[p.tema];
  if (p.tipo === 'fundo') {
    const cena = new THREE.Scene();
    cena.environment = env;
    cena.environmentIntensity = 0.22;
    criarArena(cena, { cor0: tema.cores[0], cor1: tema.cores[1], titulo: tema.telao, logo: tema.logo });
    r.setClearColor(0, 1);
    const comp = new EffectComposer(r);
    comp.addPass(new RenderPass(cena, camera()));
    comp.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.4, 0.5, 0.92));
    comp.addPass(new OutputPass());
    comp.render();
    return r.domElement.toDataURL('image/jpeg', 0.88);
  }
  if (p.tipo === 'sprite') {
    const cena = new THREE.Scene();
    cena.environment = env;
    cena.environmentIntensity = 0.22;
    criarLuzes(cena, tema.cores[0], tema.cores[1]);
    const chao = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.55 }));
    chao.rotation.x = -Math.PI / 2;
    chao.receiveShadow = true;
    cena.add(chao);
    const l = lutador(tema.ids[p.lado]);
    posicionar(l, p.lado, p.pose);
    cena.add(l);
    r.setClearColor(0, 0);
    const cam = camera();
    r.render(cena, cam);
    cena.remove(l);
    const [x, y, w, h] = CAIXAS[p.lado];
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    c.getContext('2d').drawImage(r.domElement, x, y, w, h, 0, 0, w, h);
    // posição da cabeça na tela (para os efeitos do overlay)
    l.updateMatrixWorld(true);
    const cab = new THREE.Vector3(0, 0.12, 0).applyMatrix4(l.userData.juntas.cabeca.matrixWorld).project(cam);
    return { png: c.toDataURL('image/png'), cabeca: [Math.round((cab.x + 1) / 2 * W), Math.round((1 - cab.y) / 2 * H)] };
  }
  if (p.tipo === 'retrato') {
    const c = new THREE.Scene();
    c.environment = env;
    c.environmentIntensity = 0.6;
    const l = lutador(tema.ids[p.lado]);
    aplicarPose(l, POSES.parado);
    l.position.set(0, 0, 0);
    l.rotation.set(0, 0, 0);
    const j = l.userData.juntas;
    const cabRot = j.cabeca.rotation.clone();
    j.cabeca.rotation.set(0.05, 0, 0);
    c.add(l);
    l.updateMatrixWorld(true);
    const biscoito = Boolean(PERSONAGENS[tema.ids[p.lado]].cabeca);
    const pc = new THREE.Vector3(0, biscoito ? 0.11 : 0.12, 0).applyMatrix4(j.cabeca.matrixWorld);
    const cam = new THREE.PerspectiveCamera(biscoito ? 30 : 24, 1, 0.1, 10);
    const frente = new THREE.Vector3(0, 0, 1).applyQuaternion(j.coluna.getWorldQuaternion(new THREE.Quaternion())).setY(0).normalize();
    cam.position.copy(pc).addScaledVector(frente, 1.3).add(new THREE.Vector3(0, 0.02, 0));
    cam.lookAt(pc);
    const k = new THREE.DirectionalLight('#fff', 3.2); k.position.copy(cam.position).add(new THREE.Vector3(0.5, 0.6, 0)); c.add(k);
    const k2 = new THREE.DirectionalLight('#ffe6d0', 1.4); k2.position.copy(cam.position).add(new THREE.Vector3(-0.8, 0, 0)); c.add(k2);
    c.add(new THREE.HemisphereLight('#cfd8ff', '#402a20', 1.2));
    const rt = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    rt.setSize(360, 360);
    rt.toneMapping = THREE.ACESFilmicToneMapping;
    rt.toneMappingExposure = 1.3;
    rt.setClearColor(0, 0);
    rt.render(c, cam);
    c.remove(l);
    j.cabeca.rotation.copy(cabRot);
    const url = rt.domElement.toDataURL('image/png');
    rt.dispose();
    return url;
  }
  throw new Error('tipo desconhecido');
};
window.pronto = true;
</script></body></html>
