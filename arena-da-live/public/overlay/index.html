<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Arena da Live — Tela</title>
  <link rel="stylesheet" href="/comum/fontes.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="palco">
    <div id="fundo">
      <div class="holofote h1"></div>
      <div class="holofote h2"></div>
      <div id="plateia"></div>
    </div>

    <header id="topo">
      <div id="titulo"></div>
      <div id="subtitulo"></div>
    </header>

    <section id="cartoes">
      <div class="cartao" data-lado="0">
        <div class="cartao-nome"></div>
        <div class="cartao-pontos"><span class="num">0</span><small>PTS</small></div>
        <div class="cartao-presentes"></div>
        <div class="cartao-dica"></div>
        <div class="cartao-top"></div>
      </div>
      <div id="centro">
        <div id="round">ROUND 1</div>
        <div id="tempo">03:00</div>
        <div id="placar"><span class="p0">0</span><em>x</em><span class="p1">0</span></div>
        <div id="fase"></div>
      </div>
      <div class="cartao" data-lado="1">
        <div class="cartao-nome"></div>
        <div class="cartao-pontos"><span class="num">0</span><small>PTS</small></div>
        <div class="cartao-presentes"></div>
        <div class="cartao-dica"></div>
        <div class="cartao-top"></div>
      </div>
    </section>

    <section id="vidas">
      <div class="vida" data-lado="0"><div class="vida-rastro"></div><div class="vida-cheia"></div><span class="vida-num"></span></div>
      <div id="vs">VS</div>
      <div class="vida" data-lado="1"><div class="vida-rastro"></div><div class="vida-cheia"></div><span class="vida-num"></span></div>
    </section>

    <section id="arena">
      <div id="ringue">
        <div class="corda c1"></div><div class="corda c2"></div><div class="corda c3"></div>
        <div class="poste p0"></div><div class="poste p1"></div>
        <div id="lona"><span id="lona-texto"></span></div>
      </div>
      <div class="lutador" data-lado="0"><div class="lutador-bob"><div class="lutador-corpo"><img class="lutador-img" alt=""></div></div></div>
      <div class="lutador" data-lado="1"><div class="lutador-bob"><div class="lutador-corpo"><img class="lutador-img" alt=""></div></div></div>
      <canvas id="efeitos" width="1080" height="840"></canvas>
      <div id="numeros"></div>
      <div class="balao" data-quem="0"><div class="balao-texto"></div></div>
      <div class="balao" data-quem="1"><div class="balao-texto"></div></div>
      <div class="balao" data-quem="narrador"><div class="balao-texto"></div></div>
      <div id="anuncio"><div class="anuncio-titulo"></div><div class="anuncio-sub"></div></div>
      <div id="guardado"></div>
    </section>

    <section id="cabo">
      <div class="cabo-lado" data-lado="0"><span class="cabo-texto"></span></div>
      <div class="cabo-lado" data-lado="1"><span class="cabo-texto"></span></div>
      <div id="cabo-no"></div>
    </section>

    <div id="ticker"><div id="ticker-texto"></div></div>

    <section id="baixo">
      <div id="mapa-box">
        <div id="mapa-cabecalho">
          <span class="mapa-conta" data-lado="0"></span>
          <span class="mapa-titulo">CONQUISTA DO BRASIL</span>
          <span class="mapa-conta" data-lado="1"></span>
        </div>
        <svg id="mapa"></svg>
        <div id="mapa-dica">Comente a sigla do seu estado (ex.: <b>SP</b>) e conquiste ele!</div>
      </div>
      <div id="camera"><div id="camera-selo">● AO VIVO</div><span>SUA CÂMERA AQUI</span></div>
    </section>

    <footer id="aviso"><div id="aviso-texto"></div><div id="aviso-ia"></div></footer>
  </div>

  <button id="ativar-som" hidden>🔊 Clique aqui para ativar o som</button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/comum/mapa.js"></script>
  <script src="/comum/sons.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
